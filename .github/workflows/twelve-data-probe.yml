name: Twelve Data sample diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check XAUUSD M15 price and volume samples
        env:
          TWELVE_KEY: ${{ secrets.TWELVE_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, math, datetime as dt
          import urllib.request, urllib.parse, urllib.error
          from pathlib import Path
          key = os.environ.get('TWELVE_KEY', '')
          if not key:
              raise SystemExit('TWELVE_KEY is unavailable; no request made.')
          out = Path('twelve_probe_output')
          out.mkdir(exist_ok=True)
          now = dt.datetime.now(dt.timezone.utc)
          probes = [('recent', {'outputsize': '96'}), ('march_2026', {'start_date': '2026-03-02 00:00:00', 'end_date': '2026-03-03 23:45:00', 'outputsize': '200'})]
          summaries = []
          for label, extra in probes:
              params = {'symbol': 'XAU/USD', 'interval': '15min', 'timezone': 'UTC', 'format': 'JSON', 'order': 'ASC', 'apikey': key, **extra}
              request = urllib.request.Request('https://api.twelvedata.com/time_series?' + urllib.parse.urlencode(params))
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as error:
                  try:
                      payload = json.load(error)
                  except Exception:
                      payload = {'status': 'error', 'code': error.code}
              except Exception as error:
                  payload = {'status': 'error', 'error_type': type(error).__name__}
              safe = json.dumps(payload, ensure_ascii=False).replace(key, '[REDACTED]')
              (out / (label + '.json')).write_text(safe)
              payload = json.loads(safe)
              rows = payload.get('values') or []
              summary = {'sample': label, 'rows_received': len(rows), 'provider_code': payload.get('code'), 'meta': payload.get('meta'), 'closed_rows': 0, 'invalid_rows': 0, 'volume_missing': 0, 'VP_backtest_admitted': False}
              times, volumes = [], []
              for row in rows:
                  try:
                      stamp = dt.datetime.fromisoformat(row['datetime'].replace('Z', '+00:00'))
                      if stamp.tzinfo is None:
                          stamp = stamp.replace(tzinfo=dt.timezone.utc)
                      if stamp + dt.timedelta(minutes=15) > now:
                          continue
                      o, h, l, c = [float(row[k]) for k in ['open', 'high', 'low', 'close']]
                      if not all(math.isfinite(x) and x > 0 for x in [o, h, l, c]) or not l <= min(o, c) <= max(o, c) <= h:
                          summary['invalid_rows'] += 1
                      times.append(stamp)
                      try:
                          v = float(row['volume'])
                          if not math.isfinite(v) or v < 0:
                              raise ValueError('invalid volume')
                          volumes.append(v)
                      except (KeyError, TypeError, ValueError):
                          summary['volume_missing'] += 1
                  except (KeyError, ValueError, TypeError):
                      summary['invalid_rows'] += 1
              summary.update(closed_rows=len(times), duplicate_times=len(times)-len(set(times)), first_utc=min(times).isoformat() if times else None, last_utc=max(times).isoformat() if times else None, volume_observations=len(volumes), volume_varies=len(set(volumes))>1, volume_min=min(volumes) if volumes else None, volume_max=max(volumes) if volumes else None)
              summary['note'] = 'A variable volume field needs documented semantics before comparison with the original quote-count profile. No backtest was run.'
              summaries.append(summary)
              print(json.dumps(summary, ensure_ascii=False))
          (out / 'summary.json').write_text(json.dumps(summaries, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write('## Twelve Data XAU/USD M15 diagnostics\n\n```json\n' + json.dumps(summaries, indent=2) + '\n```\n')
          if any(s['rows_received'] == 0 for s in summaries):
              raise SystemExit(2)
          PY
      - name: Save diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twelve-data-sample-diagnostics
          path: twelve_probe_output/
          if-no-files-found: warn
          retention-days: 7
